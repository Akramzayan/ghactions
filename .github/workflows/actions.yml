on:
  workflow_dispatch:

jobs:
  hybrid-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Run a command in ubuntu VM
        run: echo "This runs on Ubuntu VM"

      - name: Run inside an Alpine Container
        uses: docker://alpine:3.14
        with:
          entrypoint: /bin/sh
          args: -c "echo 'This step runs inside Alpine container'"

      - name: Run another command in Ubuntu VM
        run: echo "Back to VM"

  dockerized-job:
    runs-on: ubuntu-latest
    container: node:20
    steps:
      - run: node --version
      - run: echo "This runs inside node container"

